name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-pip openjdk-8-jdk
        sudo apt-get install -y libssl-dev libffi-dev python3-dev
        sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev
        sudo apt-get install -y automake libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        sudo apt-get install -y libncurses5 libncursesw5
    
    - name: Install buildozer
      run: |
        pip install buildozer
        
    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: .buildozer_cache
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
    
    - name: Build APK
      run: |
        buildozer android debug
      env:
        BUILDOZER_WARN_IGNORE_ROOT_TTY: 1
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: raw-camera-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
